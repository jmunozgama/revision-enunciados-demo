* { box-sizing: border-box; }

.cnt { color: var(--pend); }

.pbody { padding: 0 14px 8px; }
.pbody > .c:last-of-type { border-bottom: none; }

.okall { font-size: 12px; font-weight: 600; color: var(--ok); background: var(--ok-soft);

.okbtn { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 1px 12px;

.okbtn.on { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 600; }
.all { display: grid; grid-template-columns: max-content max-content max-content max-content; gap: 2px 22px;

.all .h { color: var(--muted); }
.all .y { color: var(--ok); font-weight: 600; }
.all .x { color: var(--faint); }

.c { position: relative; padding: 9px 0 9px 24px; border-bottom: 1px solid var(--line); }
.c .st { position: absolute; left: 2px; top: 9px; width: 16px; text-align: center; font-weight: 700; }
.st.Pendiente { color: var(--pend); }
.st.Resuelto { color: var(--ok); }
.st.Rechazado { color: var(--rej); }
.st.Info { color: var(--info); }
nav .inf, .inf { color: var(--info); }
.c.closed > .body { color: var(--muted); }
.body { white-space: pre-wrap; overflow-wrap: anywhere; }

.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--rej); color: #fff;

.evals textarea { width: 100%; min-height: 80px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;

.evals .row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
</style>
</head>

: "felipe", "h": 30, "text": "¿Te refieres a si 1 es feliz o al formato de salida?", "act": "Info"}, {"by": "bruno", "h": 8, "text": "A si 1 es feliz: el enunciado no lo dice y el testcase 3 asume que sí."}]}, {"p": 2, "part": "A", "by": "bruno", "h": 62, "text": "\"Entero positivo n ≥ 1\" puede leerse como que hay que validar el input. Pondría \"(n ≥ 1)\".", "state": "Resuelto", "replies": [{"by": "felipe", "h": 46, "text": "Cambiado.", "act": "Resuelto"}]}, {"p": 2, "part": "B", "by": "ana", "h": 61, "text": "Mi solución correcta dio timeout en un testcase. ¿El límite de tiempo está pensado para fuerza bruta?", "replies": [{"by": "felipe", "h": 45, "text": "Hecho: se redujo el tamaño de los casos grandes.", "act": "Resuelto"}, {"by": "ana", "h": 30, "text": "Lo volví a probar y sigue dando timeout el caso 7.", "act": "Reabierto"}, {"by": "felipe", "h": 6, "text": "Revisando: el caso 7 quedó con el tamaño antiguo. Lo cambio hoy."}]}, {"p": 2, "part": "C", "by": "carla", "h": 60, "text": "¿Pueden borrar el código entregado y escribir el suyo? Habría que decirlo explícitamente.", "state": "Rechazado", "replies": [{"by": "felipe", "h": 44, "text": "No lo cambiamos: el enunciado ya dice \"puedes hacer los cambios que estimes convenientes\".", "act": "Rechazado"}, {"by": "carla", "h": 40, "text": "OK, me parece bien."}]}, {"p": 2, "part": "C", "by": "diego", "h": 59, "text": "Sin arreglar nada del código entregado ya se pasan 2 testcases. Estamos regalando puntos.", "state": "Resuelto", "replies": [{"by": "felipe", "h": 43, "text": "Hecho: ahora sin cambios no pasa ningún testcase privado.", "act": "Resuelto"}]}, {"p": 3, "part": "", "by": "carla", "h": 58, "text": "Recordar que pueden leer las preguntas en cualquier orden: en la B y la C hay que volver a explicar cómo funciona la biblioteca.", "state": "Resuelto", "replies": [{"by": "elena", "h": 42, "text": "Hecho: se agregó un párrafo corto al inicio de la B y la C.", "act": "Resuelto"}]}, {"p": 3, "part": "A", "by": "diego", "h": 57, "text": "¿Los libros prestados cuentan como ocupados o como libres en el estante?", "state": "Resuelto", "replies": [{"by": "elena", "h": 41, "text": "Hecho: se aclaró que cuentan como libres.", "act": "Resuelto"}]}, {"p": 3, "part": "B", "by": "ana", "h": 33, "text": "El ejemplo no coincide con lo que dice el enunciado.", "state": "Info", "replies": [{"by": "elena", "h": 5, "text": "¿Cuál ejemplo? En Clearn la parte B tiene dos. ¿Y qué esperabas que saliera?", "act": "Info"}]}, {"p": 3, "part": "B", "by": "ana", "h": 56, "text": "\"estante\" aparece sin tilde en el segundo párrafo.", "state": "Resuelto", "replies": [{"by": "elena", "h": 40, "text": "", "act": "Resuelto"}]}, {"p": 3, "part": "C", "by": "bruno", "h": 55, "text": "No se entiende qué devuelve la función si el grupo de libros no cabe en ningún estante.", "replies": [{"by": "elena", "h": 18, "text": "Hecho: se agregó \"retorna -1 si no cabe\".", "act": "Resuelto"}, {"by": "bruno", "h": 2, "text": "El enunciado ya lo dice, pero el ejemplo 2 sigue mostrando None en vez de -1.", "act": "Reabierto"}]}, {"p": 3, "part": "C", "by": "diego", "h": 4, "text": "Agregaría una imagen para el caso en que no cabe el grupo de libros."}], "reviews": {"ana:1A": {"ok": true, "min": 6, "dif": 2}, "bruno:1A": {"min": 8, "dif": 2}, "carla:1A": {"ok": true, "min": 5, "dif": 1}, "diego:1A": {"ok": true, "min": 7, "dif": 2}, "ana:1B": {"min": 10, "dif": 3}, "bruno:1B": {"ok": true, "min": 9, "dif": 3}, "diego:1B": {"min": 12, "dif": 3}, "ana:1C": {"min": 18, "dif": 4}, "carla:1C": {"min": 22, "dif": 4}, "ana:2A": {"ok": true, "min": 12, "dif": 2}, "bruno:2A": {"ok": true, "min": 15, "dif": 3}, "carla:2A": {"ok": true, "min": 11, "dif": 2}, "diego:2A": {"ok": true, "min": 10, "dif": 2}, "ana:2B": {"min": 14, "dif": 3}, "bruno:2B": {"ok": true, "min": 12, "dif": 3}, "carla:2B": {"ok": true, "min": 16, "dif": 4}, "ana:2C": {"ok": true, "min": 9, "dif": 3}, "bruno:2C": {"ok": true, "min": 8, "dif": 3}, "carla:2C" function problems() {
  const e = curEval();
  if (!e) return [];
  return e.structure.split("\n").map(l => l.trim()).filter(Boolean).map((l, i) => {
    const j = l.lastIndexOf(":");
    const title = (j > 0 ? l.slice(0, j) : l).trim();
    const parts = j > 0 ? l.slice(j + 1).split(/[,\s]+/).filter(Boolean) : ["A", "B", "C"];
    return { id: i + 1, title, parts };
  });
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 6000);
}

// ---------- demo store: the example, kept in this browser ----------
function demoStore() {
  const KEY = "revision-enunciados:" + DATA.key;
  function seed() {
    const now = Date.now(), t = h => now - h * H;
    let n = 0;
    const structure = DATA.problems.map(p => `${p.title}: ${p.parts.join(", ")}`).join("\n");
    const comments = DATA.comments.map(c => ({
      id: ++n, eval: "e1", problem: c.p, part: c.part || "", author: c.by, created: t(c.h), text: c.text,
      state: c.state || "Pendiente",
      replies: (c.replies || []).map(r => ({ author: r.by, at: t(r.h), text: r.text || "", action: r.act || null })),
    }));
    const reviews = {};
    Object.entries(DATA.reviews || {}).forEach(([k, v]) => {
      const [pid, part] = k.split(":");
      reviews["e1|" + pid + "|" + part] = v;
    });
    const people = DATA.people.map(p => ({ admin: false, active: true, ...p }));
    return { version: DATA.version, people, evals: [{ id: "e1", title: DATA.title, structure }],
             comments, reviews, me: DATA.me, eval: "e1", nextId: n + 1 };
  }
  let D = null;
  try { if (!/[?&]reset\b/.test(location.search)) D = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  // A new build of the example replaces what this browser had saved.
  if (!D || D.version !== DATA.version) D = seed();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) {} };
  return {
    async load() { S = D; save(); return "ok"; },
    async addComment(problem, part, text) {
      D.comments.push({ id: D.nextId++, eval: D.eval, problem, part, author: D.me, created: Date.now(),
        text, state: "Pendiente", replies: [] });
      save();
    },
    async addReply(c, text, action, state) {
      c.replies.push({ author: D.me, at: Date.now(), text, action: action || null });
      c.state = state; save();
    },
    async setReview(k, patch) { D.reviews[rk(D.me, k)] = { ...review(D.me, k), ...patch }; save(); },
    async saveMember(id, patch) { Object.assign(person(id), patch); save(); },
    async addMember(f) {
      const old = D.people.find(p => (p.email || "").toLowerCase() === f.email);
      if (old) Object.assign(old, f, { active: true });
      else D.people.push({ id: "u" + Date.now().toString(36), ...f, active: true });
      save();
    },
    async addEval(f) { const id = "e" + Date.now().toString(36); D.evals.push({ id, ...f }); D.eval = id; save(); },
    async saveEval(id, f) { Object.assign(D.evals.find(e => e.id === id), f); save(); },
    setMe(id) { D.me = id; save(); },
    setEval(id) { D.eval = id; save(); },
  };
}

// ---------- real store: Supabase (tables and rules in schema.sql) ----------
function realStore() {
  const sb = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);
  let email = null;
  const must = r => { if (r.error) throw new Error(r.error.message); return r.data; };
  return {
    sb,
    async load() {
      const { data } = await sb.auth.getSession();
      if (!data.session) return "login";
      email = data.session.user.email.toLowerCase();
      const [m, e, c, r, v] = await Promise.all([
        sb.from("members").select("*"),
        sb.from("evaluations").select("*").order("created_at", { ascending: false }),
        sb.from("comments").select("*").order("created_at"),
        sb.from("replies").select("*").order("created_at"),
        sb.from("reviews").select("*"),
      ]).then(rs => rs.map(must));
      const people = m.map(x => ({ id: x.email, email: x.email, name: x.name, role: x.role, admin: x.admin, active: x.active }));
      if (!people.some(p => p.id === email && p.active)) { S = { ...S, me: email }; return "noaccess"; }
      const byComment = {};
      r.forEach(x => (byComment[x.comment_id] = byComment[x.comment_id] || []).push(
        { author: x.author, at: Date.parse(x.created_at), text: x.text || "", action: x.action }));
      const comments = c.map(x => ({ id: x.id, eval: x.evaluation_id, problem: x.problem, part: x.part, author: x.author,
        created: Date.parse(x.created_at), text: x.text, state: x.state, replies: byComment[x.id] || [] }));
      const reviews = {};
      v.forEach(x => { reviews[x.evaluation_id + "|" + x.author + "|" + x.part_key] = { dif: x.dif ?? undefined, min: x.minutes ?? undefined, ok: x.ok }; });
      let ev = S.eval;
      try { ev = ev ?? JSON.parse(localStorage.getItem("revision-enunciados:eval")); } catch (err) {}
      if (!e.some(x => x.id === ev)) ev = e.length ? e[0].id : null;
      S = { people, evals: e.map(x => ({ id: x.id, title: x.title, structure: x.structure })), comments, reviews, me: email, eval: ev };
      return "ok";
    },
    async addComment(problem, part, text) {
      must(await sb.from("comments").insert({ evaluation_id: S.eval, problem, part, text }));
    },
    async addReply(c, text, action, state) {
      must(await sb.from("replies").insert({ comment_id: c.id, text, action: action || null }));
      if (state !== c.state) must(await sb.from("comments").update({ state }).eq("id", c.id));
    },
    async setReview(k, patch) {
      const r = { ...review(email, k), ...patch };
      must(await sb.from("reviews").upsert({ evaluation_id: S.eval, part_key: k, author: email,
        dif: r.dif ?? null, minutes: r.min ?? null, ok: !!r.ok }));
    },
    async saveMember(id, patch) { must(await sb.from("members").update(patch).eq("email", id)); },
    async addMember(f) { must(await sb.from("members").upsert({ ...f, active: true })); },
    async addEval(f) {
      const row = must(await sb.from("evaluations").insert(f).select().single());
      S.eval = row.id; this.setEval(row.id);
    },
    async saveEval(id, f) { must(await sb.from("evaluations").update(f).eq("id", id)); },
    setEval(id) { S.eval = id; try { localStorage.setItem("revision-enunciados:eval", JSON.stringify(id)); } catch (e) {} },
    async signIn(addr) {
      must(await sb.auth.signInWithOtp({ email: addr, options: { emailRedirectTo: location.origin + location.pathname } }));
    },
    async signOut() { await sb.auth.signOut(); location.reload(); },
  };
}

const store = REAL ? realStore() : demoStore();

async function refresh() {
  try { ui.screen = await store.load(); }
  catch (e) { toast("No se pudo cargar: " + e.message); }
  render();
}

// Every change goes to the store, then the page reloads its data from it.
async function act(fn) {
  try { await fn(); }
  catch (e) { toast("No se pudo guardar: " + e.message); }
  await refresh();
}

// ---------- per-part review: difficulty, time, OK ----------
function partStats(k) {
  const rs = profs().map(p => review(p.id, k));
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const oks = profs().filter(p => review(p.id, k).ok);
  return { dif: avg(rs.map(r => r.dif).filter(Boolean)), min: avg(rs.map(r => r.min).filter(Boolean)),
           oks, allOk: profs().length > 0 && oks.length === profs().length };
}
function problemStats(p) {
  const st = p.parts.map(x => partStats(p.id + x));
  const mins = st.map(s => s.min).filter(v => v !== null);
  const difs = st.map(s => s.dif).filter(v => v !== null);
  return { min: mins.length === st.length ? mins.reduce((a, b) => a + b, 0) : null,
           dif: difs.length ? difs.reduce((a, b) => a + b, 0) / difs.length : null,
           allOk: st.every(s => s.allOk) };
}

// ---------- rendering ----------
function render() {
  const doc = document.getElementById("doc"), title = document.getElementById("title"), user = document.getElementById("user");
  const nav = document.getElementById("nav");
  if (ui.screen === "login" || ui.screen === "noaccess") {
    title.textContent = "Revisión de enunciados"; user.innerHTML = ""; nav.innerHTML = "";
    doc.innerHTML = ui.screen === "login"
      ? `<div class="card"><h2>Entrar</h2><p>Escribe tu correo y te enviaremos un enlace para entrar.</p>
          <input type="email" id="login-email" placeholder="correo@uc.cl" data-focus>
          <button class="btn pri" data-act="login">Enviarme el enlace</button><p id="login-msg"></p></div>`
      : `<div class="card"><h2>Sin acceso</h2><p>El correo ${esc(S.me)} no tiene acceso. Pide a un admin que te agregue.</p>
          <button class="btn" data-act="logout">Salir</button></div>`;
    const f = document.querySelector("[data-focus]"); if (f) f.focus();
    return;
  }
  if (!isAdmin()) ui.view = "doc";
  const evSel = S.evals.length > 1
    ? `<select id="evalsel" aria-label="Evaluación">${S.evals.map(e => `<option value="${esc(e.id)}"${e.id === S.eval ? " selected" : ""}>${esc(e.title)}</option>`).join("")}</select>`
    : esc(curEval() ? curEval().title : "Revisión de enunciados");
  const tot = problems().map(problemStats);
  const est = tot.length && tot.every(s => s.min !== null) ? `tiempo estimado ≈ ${Math.round(tot.reduce((a, s) => a + s.min, 0))} min` : "";
  title.innerHTML = `${evSel}<span class="est">${est}</span>`;
  const acc = isAdmin() ? `<button class="lk" data-act="access">${ui.view === "access" ? "← Volver a la revisión" : "Acceso"}</button>` : "";
  user.innerHTML = acc + (REAL
    ? `<span class="hint">${esc(person(S.me).name)}</span><button class="lk" data-act="logout">Salir</button>`
    : `<select id="me" aria-label="Usuario">${active().map(p =>
        `<option value="${esc(p.id)}"${p.id === S.me ? " selected" : ""}>${p.role === "coord" ? "◆ " : ""}${esc(p.name)}</option>`).join("")}</select>`);
  if (ui.view === "access") { nav.innerHTML = ""; doc.innerHTML = renderAccess(); return; }
  if (!curEval()) {
    nav.innerHTML = "";
    doc.innerHTML = `<div class="card"><p>Aún no hay ninguna evaluación. ${isAdmin() ? "Créala en Acceso." : "Un admin debe crearla."}</p></div>`;
    return;
  }
  renderNav();
  const groups = [{ id: 0, title: "Comentarios generales", parts: [] }, ...problems()];
  doc.innerHTML = groups.map(renderProblem).join("");
  document.querySelectorAll("[data-draft]").forEach(t => { t.value = ui.drafts[t.dataset.draft] || ""; });
  const f = document.querySelector("[data-focus]");
  if (f) f.focus();
}

function renderNav() {
  const cnt = (pid, part) => {
    const n = pend(pid, part), w = waiting(pid, part);
    return n || w ? `<span>${n ? `<span class="cnt">${n}</span>` : ""}${w ? ` <span class="inf" title="esperando información">?${w}</span>` : ""}</span>` : "";
  };
  document.getElementById("nav").innerHTML =
    `<a class="prob" href="#p0"><span>General</span>${cnt(0)}</a>` +
    problems().map(p => `<a class="prob" href="#p${p.id}"><span>${p.id}. ${esc(p.title)}</span>${cnt(p.id)}</a>` +
      p.parts.map(x => `<a class="sub" href="#p${p.id}${esc(x)}"><span>Parte ${esc(x)}</span>${cnt(p.id, x) || (partStats(p.id + x).allOk ? `<span class="done">✓ OK</span>` : "")}</a>`).join("")).join("");
}

function renderProblem(p) {
  const n = pend(p.id);
  const w = waiting(p.id);
  let meta = [n ? `<span class="cnt">${n} pendiente${n > 1 ? "s" : ""}</span>` : "",
              w ? `<span class="inf">${w} esperando información</span>` : ""].filter(Boolean).join(" · ");
  if (p.id) {
    const s = problemStats(p);
    const bits = [];
    if (s.min !== null) bits.push(`≈ ${Math.round(s.min)} min`);
    if (s.dif !== null) bits.push(`dificultad ${fmt(s.dif)}`);
    if (s.allOk && !n && !w) bits.push(`<span class="alldone">✓ OK de todos</span>`);
    meta = [meta, ...bits].filter(Boolean).join(" · ");
  }
  const head = `<h2><span>${p.id ? "Pregunta " + p.id + ": " : ""}${esc(p.title)}</span><span class="meta">${meta}</span></h2>`;
  if (p.id === 0) return `<section class="prob" id="p0">${head}<div class="part"><h3>Toda la evaluación</h3><div class="pbody">${renderList(0, "")}</div></div></section>`;
  const whole = `<div class="part"><h3>Todo el problema</h3><div class="pbody">${renderList(p.id, "")}</div></div>`;
  return `<section class="prob" id="p${p.id}">${head}${whole}${p.parts.map(x => {
    const k = p.id + x, s = partStats(k);
    return `<div class="part" id="p${esc(k)}"><h3><span>Parte ${esc(x)}</span>${s.allOk ? `<span class="okall">✓ OK de todos</span>` : ""}</h3>
      <div class="pbody">${renderReview(k, s)}${renderList(p.id, x)}</div></div>`;
  }).join("")}</section>`;
}

function renderReview(k, s) {
  const sum = [];
  sum.push(`<span class="avg">Dificultad <b>${s.dif === null ? "–" : fmt(s.dif) + "/5"}</b></span>`);
  sum.push(`<span class="avg">Tiempo <b>${s.min === null ? "–" : Math.round(s.min) + " min"}</b></span>`);
  sum.push(`<span class="avg">OK <b>${s.oks.length}/${profs().length}</b>${s.oks.length ? ` <span class="okers">${s.oks.map(p => esc(first(p.id))).join(", ")}</span>` : ""}</span>`);
  const detail = profs().map(p => {
    const r = review(p.id, k);
    return `${p.name}: dificultad ${r.dif || "–"}, tiempo ${r.min ? r.min + " min" : "–"}, ${r.ok ? "OK" : "sin OK"}`;
  }).join("\n");
  let mine = "";
  if (role(S.me) === "prof") {
    const r = review(S.me, k);
    mine = `<div class="mine"><span class="lbl">Tu revisión</span>
      <span>Dificultad <span class="seg">${[1, 2, 3, 4, 5].map(d =>
        `<button data-act="dif" data-k="${esc(k)}" data-v="${d}" class="${r.dif === d ? "on" : ""}">${d}</button>`).join("")}</span></span>
      <label>Tiempo <input type="number" min="0" inputmode="numeric" data-rev="min" data-k="${esc(k)}" value="${r.min ?? ""}"> min</label>
      <button data-act="ok" data-k="${esc(k)}" class="okbtn${r.ok ? " on" : ""}" title="${r.ok ? "Clic para retirar tu OK" : "Para mí esta parte está lista"}">${r.ok ? "✓ OK" : "Dar OK"}</button>
    </div>`;
  } else {
    mine = `<div class="all"><span class="h">Profe</span><span class="h">Dificultad</span><span class="h">Tiempo</span><span class="h">OK</span>${
      profs().map(p => {
        const r = review(p.id, k);
        return `<span>${esc(first(p.id))}</span><span>${r.dif ? r.dif + "/5" : `<span class="x">–</span>`}</span>` +
          `<span>${r.min ? r.min + " min" : `<span class="x">–</span>`}</span><span>${r.ok ? `<span class="y">✓ OK</span>` : `<span class="x">–</span>`}</span>`;
      }).join("")}</div>`;
  }
  return `<div class="rev" title="${esc(detail)}">${sum.join("")}</div>${mine}`;
}

function renderList(pid, part) {
  const cs = evComments().filter(c => c.problem === pid && c.part === part);
  const key = pid + ":" + part;
  const add = ui.adding === key
    ? `<div class="box" style="margin-left:24px"><textarea data-draft="new${esc(key)}" data-focus placeholder="Tu comentario"></textarea>
        <div class="row"><button class="btn pri" data-act="post" data-v="${esc(key)}">Publicar</button>
        <button class="lk" data-act="add" data-v="">cancelar</button><span class="hint">⌘/Ctrl + Enter publica</span></div></div>`
    : `<div class="add"><button class="lk" data-act="add" data-v="${esc(key)}">+ Nuevo comentario</button></div>`;
  return cs.map(renderComment).join("") + add;
}

function stateTitle(c) {
  const last = [...c.replies].reverse().find(r => r.action);
  return LABEL[c.state] + (last && c.state !== "Pendiente" ? " (" + person(last.author).name + ")" : "");
}

function renderComment(c) {
  const long = c.text.length > 320 && !ui.expanded[c.id];
  const reps = c.replies.map(r => {
    // A state change always shows, as a tag inside the reply of whoever made it.
    const tag = r.action ? `<span class="tag ${r.action}">${TAG[r.action]}</span>` : "";
    return `<div class="r ${role(r.author)}">${name(r.author)}${tag ? tag + (r.text ? " " + esc(r.text) : "") : ": " + esc(r.text)}</div>`;
  }).join("");
  const a = [`<button data-act="reply" data-v="${c.id}">responder</button>`];
  if (!closed(c)) {
    if (isCoord()) a.push(`<button data-act="state" data-v="${c.id}" data-s="Resuelto">✓ resuelto</button>`,
                          `<button data-act="state" data-v="${c.id}" data-s="Rechazado">✕ rechazar</button>`);
    if (isCoord() && c.state === "Pendiente") a.push(`<button data-act="reply" data-v="${c.id}" data-mode="ask">? pedir información</button>`);
  } else a.push(`<button data-act="reply" data-v="${c.id}" data-mode="reopen">reabrir</button>`);
  let box = "";
  if (ui.open && ui.open.id === c.id) {
    const mode = ui.open.mode;
    const ph = { reopen: "¿Qué falta?", ask: "¿Qué información necesitas del profe?" }[mode] || "Respuesta";
    box = `<div class="box"><textarea data-draft="r${c.id}" data-focus placeholder="${ph}"></textarea>
      <div class="row">${mode === "reopen"
        ? `<button class="btn pri" data-act="send" data-v="${c.id}" data-s="Pendiente">Reabrir</button>`
        : mode === "ask"
        ? `<button class="btn pri" data-act="send" data-v="${c.id}" data-s="Info">Pedir información</button>`
        : `<button class="btn pri" data-act="send" data-v="${c.id}">Responder</button>` +
          (isCoord() && !closed(c) ? `<button class="btn" data-act="send" data-v="${c.id}" data-s="Resuelto">Responder y resolver</button><button class="btn" data-act="send" data-v="${c.id}" data-s="Rechazado">Responder y rechazar</button>` : "")}
        <button class="lk" data-act="reply" data-v="">cancelar</button></div></div>`;
  }
  return `<div class="c${closed(c) ? " closed" : ""}${long ? " clamp" : ""}">
    <span class="st ${c.state}" title="${esc(stateTitle(c))}">${GLYPH[c.state]}</span>
    <div class="body">${name(c.author)}: ${esc(c.text)}</div>
    ${long ? `<button class="more" data-act="expand" data-v="${c.id}">ver todo</button>` : ""}
    ${reps}
    <div class="acts">${a.join("")}</div>${box}
  </div>`;
}

  const rows = active().map(p => `<tr>
      <td>${esc(p.name)}</td><td class="em">${esc(p.email || "")}</td><td>${roleSel(`data-acc="role" data-id="${esc(p.id)}"`, p.role)}</td>

      <td>${p.id === S.me ? "" : `<button class="lk" data-act="acc-remove" data-v="${esc(p.id)}">quitar acceso</button>`}</td></tr>`).join("");

  return `<section class="prob"><h2><span>Acceso</span><span class="meta">${active().length} personas</span></h2>
    <table class="acc"><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th></th><th></th></tr></thead><tbody>${rows}
      <tr><td><input type="text" id="acc-name" placeholder="Nombre Apellido"></td>
        <td><input type="email" id="acc-email" placeholder="correo@uc.cl"></td>
        <td>${roleSel('id="acc-role"', "prof")}</td>
        <td><label><input type="checkbox" id="acc-admin"> admin</label></td>
        <td><button class="btn pri" data-act="acc-add">Agregar</button></td></tr>
    </tbody></table>${ui.accErr ? `<div class="acc"><span class="err">${esc(ui.accErr)}</span></div>` : ""}
  </section>
  <section class="prob evals"><h2><span>Evaluaciones</span></h2>
    <p class="hint">Una línea por problema, con sus partes: <code>Tren de carga: A, B, C</code>. Los títulos solo se ven aquí dentro.</p>
    ${evs}
    <div class="ev"><input type="text" id="ev-title" placeholder="Nueva evaluación (ej. I3)">
      <textarea id="ev-struct" placeholder="Problema 1: A, B, C&#10;Problema 2: A, B, C&#10;Problema 3: A, B, C"></textarea>
      <div class="row"><button class="btn pri" data-act="ev-add">Crear</button></div></div>
  </section>`;
}

function accAdd() {
  const nm = document.getElementById("acc-name").value.trim();
  const email = document.getElementById("acc-email").value.trim().toLowerCase();
  if (!nm || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { ui.accErr = "Falta el nombre o el correo no es válido."; return render(); }
  if (active().some(p => (p.email || "").toLowerCase() === email)) { ui.accErr = "Ese correo ya tiene acceso."; return render(); }
  ui.accErr = "";
  act(() => store.addMember({ name: nm, email, role: document.getElementById("acc-role").value, admin: document.getElementById("acc-admin").checked }));
}

// ---------- events ----------
function sendReply(c, state, text) {
  if (c.state === "Info" && !state && role(S.me) === "prof") {
    // A professor answering a request for information hands the comment back to coordination.
    return text ? store.addReply(c, text, null, "Pendiente") : null;
  }
  state = state || c.state;
  const action = state === c.state ? null : state === "Pendiente" ? "Reabierto" : state;
  if ((state === "Info" && !text) || (!text && !action)) return null;
  return store.addReply(c, text, action, state);
}

document.addEventListener("input", e => { if (e.target.dataset.draft) ui.drafts[e.target.dataset.draft] = e.target.value; });
document.addEventListener("keydown", e => {
  const t = e.target;
  if (t.id === "login-email" && e.key === "Enter") { document.querySelector('[data-act="login"]').click(); return; }
  if (!t.dataset || !t.dataset.draft) return;
  if (e.key === "Escape") { ui.adding = null; ui.open = null; render(); }
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
    const b = t.parentElement.querySelector(".btn.pri");
    if (b) b.click();
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "me") { store.setMe(t.value); ui.open = ui.adding = null; refresh(); return; }
  if (t.id === "evalsel") { store.setEval(isNaN(t.value) || !REAL ? t.value : Number(t.value)); ui.open = ui.adding = null; refresh(); return; }
  if (t.dataset.acc) {
    const patch = t.dataset.acc === "role" ? { role: t.value } : { admin: t.checked };
    if (t.dataset.id === S.me && t.dataset.acc === "admin") return;
    act(() => store.saveMember(t.dataset.id, patch));
    return;
  }
  if (t.dataset.rev === "min") {
    const min = t.value === "" ? undefined : Math.max(0, parseInt(t.value, 10) || 0);
    act(() => store.setReview(t.dataset.k, { min }));
  }
});
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const v = b.dataset.v;
  const c = S.comments.find(x => String(x.id) === v);
  switch (b.dataset.act) {
    case "login": {
      const addr = document.getElementById("login-email").value.trim().toLowerCase();
      const msg = document.getElementById("login-msg");
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(addr)) { msg.textContent = "Ese correo no es válido."; return; }
      b.disabled = true;
      store.signIn(addr).then(() => { msg.textContent = "Listo: revisa tu correo y abre el enlace."; })
        .catch(err => { msg.textContent = "No se pudo enviar: " + err.message; b.disabled = false; });
      return;
    }
    case "logout": store.signOut(); return;
    case "add": ui.adding = v || null; ui.open = null; break;
    case "post": {
      const text = (ui.drafts["new" + v] || "").trim();
      if (!text) return;
      const [pid, part] = v.split(":");
      delete ui.drafts["new" + v]; ui.adding = null;
      act(() => store.addComment(Number(pid), part, text));
      return;
    }
    case "reply": ui.open = v ? { id: c.id, mode: b.dataset.mode } : null; ui.adding = null; break;
    case "state": act(() => sendReply(c, b.dataset.s, "")); return;
    case "send": {
      const text = (ui.drafts["r" + v] || "").trim();
      const p = sendReply(c, b.dataset.s, text);
      if (!p) return;
      delete ui.drafts["r" + v]; ui.open = null;
      act(() => p);
      return;
    }
    case "expand": ui.expanded[v] = true; break;
    case "dif": { const r = review(S.me, b.dataset.k); act(() => store.setReview(b.dataset.k, { dif: r.dif === Number(v) ? undefined : Number(v) })); return; }
    case "ok": { const r = review(S.me, b.dataset.k); act(() => store.setReview(b.dataset.k, { ok: !r.ok })); return; }
    case "access": ui.view = ui.view === "access" ? "doc" : "access"; ui.accErr = ""; break;
    case "acc-add": accAdd(); return;
    case "acc-remove":
      if (v === S.me || !confirm(`¿Quitar el acceso a ${person(v).name}? Sus comentarios se mantienen.`)) return;
      act(() => store.saveMember(v, { active: false }));
      return;
    case "ev-save": {
      const title = document.querySelector(`[data-evtitle="${CSS.escape(v)}"]`).value.trim();
      const structure = document.querySelector(`[data-evstruct="${CSS.escape(v)}"]`).value.trim();
      if (!title || !structure) return toast("Falta el título o la estructura.");
      const id = S.evals.find(x => String(x.id) === v).id;
      act(() => store.saveEval(id, { title, structure }));
      return;
    }
    case "ev-add": {
      const title = document.getElementById("ev-title").value.trim();
      const structure = document.getElementById("ev-struct").value.trim();
      if (!title || !structure) return toast("Falta el título o la estructura.");
      act(() => store.addEval({ title, structure }));
      return;
    }
  }
  render();
});

// Others' changes arrive when you come back to the tab, and every minute if you are not writing.
if (REAL) {
  window.addEventListener("focus", () => { if (!ui.open && !ui.adding) refresh(); });
  setInterval(() => { if (!ui.open && !ui.adding && ui.view === "doc" && document.visibilityState === "visible") refresh(); }, 60000);
  store.sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_IN") refresh(); });
}
refresh();
</script>
</body>
</html>
