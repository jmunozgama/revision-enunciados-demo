<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revisión de enunciados</title>
<style>
:root {
  --bg: #fbfbfa; --ink: #22262c; --muted: #8a919c; --faint: #c3c8cf; --line: #e7e9ec;
  --accent: #2f5fd0; --pend: #d08a12; --ok: #2e8b57; --disc: #a0a6ae; --new: #e0457b;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17191d; --ink: #e4e7eb; --muted: #8d95a1; --faint: #4a515b; --line: #2b3038;
    --accent: #86a6ff; --pend: #f0b04a; --ok: #6fcf97; --disc: #6e7580; --new: #ff7aa6; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, select, input, textarea { font: inherit; color: inherit; }
.layout { max-width: 1060px; margin: 0 auto; padding: 0 16px 120px; display: flex; gap: 40px; }
nav { width: 190px; flex: none; position: sticky; top: 0; align-self: flex-start;
  padding-top: 28px; font-size: 13px; max-height: 100vh; overflow: auto; }
nav a { display: block; color: var(--muted); text-decoration: none; padding: 1px 0; }
nav a:hover { color: var(--ink); }
nav a.prob { color: var(--ink); font-weight: 600; margin-top: 10px; }
nav a.part { padding-left: 12px; }
nav .cnt { color: var(--pend); }
main { flex: 1; min-width: 0; max-width: 720px; }
@media (max-width: 900px) { nav { display: none; } }

.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline;
  gap: 4px 16px; padding: 24px 0 4px; }
.top h1 { font-size: 20px; margin: 0; }
.who { font-size: 13px; color: var(--muted); }
.who select { border: none; background: none; color: var(--ink); font-size: 13px; padding: 0; }
.note { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.note button { border: none; background: none; color: var(--muted); text-decoration: underline;
  padding: 0; cursor: pointer; font-size: 12px; }
.legend { font-size: 12px; color: var(--muted); margin-bottom: 8px; }

h2 { font-size: 18px; margin: 36px 0 2px; padding-bottom: 4px; border-bottom: 2px solid var(--ink);
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px; scroll-margin-top: 12px; }
h2 .cnt { font-size: 13px; font-weight: 400; color: var(--pend); }
h2 .cnt.done { color: var(--ok); }
.ph { margin-top: 14px; }
h3 { font-size: 15px; margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px;
  padding: 3px 0; border-bottom: 1px solid var(--line); scroll-margin-top: 12px; }
h3 .rev { font-size: 12px; font-weight: 400; color: var(--muted); }
h3 .rev .y { color: var(--ok); }
h3 .myok { font-size: 12px; font-weight: 400; }

.c { position: relative; padding: 5px 0 5px 22px; }
.c .st { position: absolute; left: 0; top: 5px; width: 16px; text-align: center; font-weight: 700; }
.st.Pendiente { color: var(--pend); }
.st.Resuelto { color: var(--ok); }
.st.Descartado { color: var(--disc); }
.c.closed > .body { color: var(--muted); }
.c .body { white-space: pre-wrap; overflow-wrap: anywhere; }
.c .body b { color: var(--ink); }
.c.clamp > .body { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.dot { position: absolute; left: -10px; top: 13px; width: 6px; height: 6px; border-radius: 50%; background: var(--new); }
.plus1 { font-size: 13px; color: var(--accent); white-space: nowrap; margin-left: 6px; }
.r { font-size: 14px; color: var(--muted); margin: 2px 0 0; padding-left: 12px; border-left: 2px solid var(--line);
  white-space: pre-wrap; overflow-wrap: anywhere; position: relative; }
.r b { color: var(--ink); font-weight: 600; }
.r .ev { font-style: italic; }
.r .dot { left: -14px; top: 8px; }
.acts { font-size: 12px; position: absolute; right: 0; top: -6px; background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 1px 2px 1px 8px; display: none; }
.c:hover > .acts, .c:focus-within > .acts { display: block; }
@media (hover: none) { .acts { display: block; position: static; border: none; padding: 0; background: none; } }
.acts button, .lk { border: none; background: none; padding: 0 8px 0 0; color: var(--muted); cursor: pointer; font-size: 12px; }
.acts button:hover, .lk:hover { color: var(--accent); }
.acts button.on { color: var(--accent); font-weight: 600; }
.more { border: none; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; }
.add { padding: 4px 0 2px 22px; }
.add .lk { color: var(--faint); font-size: 13px; }
.add .lk:hover { color: var(--accent); }

.box { margin: 6px 0 4px; }
.box textarea { width: 100%; min-height: 64px; border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 8px; background: var(--bg); resize: vertical; }
.box textarea:focus { outline: none; border-color: var(--accent); }
.box .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; align-items: center; font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 2px 10px; cursor: pointer; font-size: 13px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.hint { font-size: 12px; color: var(--muted); }
.okform { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; font-weight: 400; }
.okform input[type=number] { width: 56px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); padding: 0 4px; }
.okform select { border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
</style>
</head>
<body>
<div class="layout">
  <nav id="nav"></nav>
  <main>
    <div class="top">
      <h1 id="title"></h1>
      <div class="who">Soy <select id="me"></select></div>
    </div>
    <div class="note" id="note"></div>
    <div class="legend"><span class="st Pendiente">○</span> pendiente &nbsp; <span class="st Resuelto">✓</span> resuelto &nbsp; <span class="st Descartado">–</span> descartado &nbsp; <span style="color:var(--new)">●</span> nuevo para ti</div>
    <div id="doc"></div>
  </main>
</div>

<script>
"use strict";
const DATA = {"key": "demo", "title": "Revisión I2 (demo)", "note": "Demo con datos inventados. Lo que hagas se guarda solo en tu navegador", "people": [{"id": "ana", "name": "Ana Rojas", "role": "prof"}, {"id": "bruno", "name": "Bruno Díaz", "role": "prof"}, {"id": "carla", "name": "Carla Soto", "role": "prof"}, {"id": "diego", "name": "Diego Paredes", "role": "prof"}, {"id": "elena", "name": "Elena Vidal", "role": "coord"}, {"id": "felipe", "name": "Felipe Mora", "role": "coord"}], "me": "ana", "seenH": {"ana": 24}, "problems": [{"id": 1, "title": "Tren de carga", "parts": ["A", "B", "C"]}, {"id": 2, "title": "Números felices", "parts": ["A", "B", "C"]}, {"id": 3, "title": "Biblioteca", "parts": ["A", "B", "C"]}], "comments": [{"p": 0, "part": "", "by": "carla", "h": 50, "text": "¿Usamos el mismo formato de salida en los tres problemas? En el 1 piden \"x y\" y en el 3 \"x, y\".", "plus": ["ana"]}, {"p": 1, "part": "A", "by": "ana", "h": 48, "text": "No está claro si el input termina con una línea vacía o con la palabra FIN.", "state": "Resuelto", "plus": ["bruno", "diego"], "replies": [{"by": "elena", "h": 30, "text": "Termina con FIN. Actualizado en Clearn.", "act": "Resuelto"}]}, {"p": 1, "part": "A", "by": "bruno", "h": 47, "text": "En los testcases públicos casi todos los trenes llegan justo con la carga exacta. Balancearía para pillar errores de < vs <=."}, {"p": 1, "part": "B", "by": "diego", "h": 46, "text": "La B se parece demasiado a la A: si no sacas la A, no sacas la B. ¿Hacemos algo independiente con la misma temática?", "plus": ["carla"], "replies": [{"by": "bruno", "h": 40, "text": "No estoy de acuerdo: la B agrega un if dentro del ciclo, sí evalúa algo más."}]}, {"p": 1, "part": "C", "by": "carla", "h": 45, "text": "El enunciado es muy largo para una pregunta de prueba. Sacaría el párrafo de la historia del tren.", "replies": [{"by": "felipe", "h": 20, "text": "Se acortó a la mitad.", "act": "Resuelto"}, {"by": "carla", "h": 3, "text": "Sigue habiendo dos párrafos de historia antes del objetivo.", "act": "Reabierto"}]}, {"p": 2, "part": "A", "by": "bruno", "h": 44, "text": "\"Entero positivo n ≥ 1\" puede leerse como que hay que validar el input. Pondría \"(n ≥ 1)\".", "state": "Resuelto", "replies": [{"by": "felipe", "h": 26, "text": "", "act": "Resuelto"}]}, {"p": 2, "part": "B", "by": "ana", "h": 42, "text": "Mi solución correcta dio timeout en un testcase. ¿El límite de tiempo está pensado para fuerza bruta?", "replies": [{"by": "elena", "h": 6, "text": "Revisando: vamos a reducir el tamaño de los casos."}]}, {"p": 2, "part": "C", "by": "carla", "h": 41, "text": "¿Pueden borrar el código entregado y escribir el suyo? Habría que decirlo explícitamente.", "state": "Descartado", "replies": [{"by": "felipe", "h": 25, "text": "El enunciado ya dice \"puedes hacer los cambios que estimes convenientes\".", "act": "Descartado"}]}, {"p": 3, "part": "A", "by": "diego", "h": 40, "text": "¿Los libros prestados cuentan como ocupados o como libres en el estante?", "plus": ["bruno"]}, {"p": 3, "part": "C", "by": "bruno", "h": 2, "text": "Agregaría una imagen para el caso en que no cabe el grupo de libros."}], "reviews": {"ana:2A": {"ok": true, "min": 12, "dif": 2}, "diego:2A": {"ok": true, "min": 10, "dif": 2}, "bruno:2A": {"min": 15, "dif": 3}, "carla:3B": {"ok": true, "min": 20, "dif": 4}}};
const KEY = "revision-enunciados:" + DATA.key;
const H = 3600e3;

// Times in DATA are "hours ago", so the example always looks recent.
function seed() {
  const now = Date.now(), t = h => now - h * H;
  let n = 0;
  const comments = DATA.comments.map(c => ({
    id: ++n, problem: c.p, part: c.part || "", author: c.by, created: t(c.h), text: c.text,
    state: c.state || "Pendiente", plus: c.plus || [],
    replies: (c.replies || []).map(r => ({ author: r.by, at: t(r.h), text: r.text || "", action: r.act })),
  }));
  const lastSeen = {};
  DATA.people.forEach(p => lastSeen[p.id] = t((DATA.seenH || {})[p.id] ?? 24));
  return { comments, reviews: structuredClone(DATA.reviews || {}), lastSeen, me: DATA.me, nextId: n + 1 };
}

let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || !S.comments) S = seed();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

// "New for you" is fixed at arrival; the visit itself counts as seen for next time.
let since;
function arrive() { since = S.lastSeen[S.me] || 0; S.lastSeen[S.me] = Date.now(); save(); }
arrive();

const ui = { open: null, adding: null, okEdit: null, expanded: {}, drafts: {} };
const P = DATA.people;
const person = id => P.find(p => p.id === id) || { name: "?", role: "" };
const first = id => person(id).name.split(" ")[0];
const isCoord = () => person(S.me).role === "coord";
const profs = () => P.filter(p => p.role === "prof");
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const isNewC = c => c.author !== S.me && c.created > since;
const isNewR = r => r.author !== S.me && r.at > since;
const pend = (pid, part) => S.comments.filter(c => c.problem === pid && (part === undefined || c.part === part) && c.state === "Pendiente").length;
const GLYPH = { Pendiente: "○", Resuelto: "✓", Descartado: "–" };

function render() {
  document.getElementById("title").textContent = DATA.title;
  document.getElementById("note").innerHTML = esc(DATA.note) + ' · <button data-act="reset">reiniciar ejemplo</button>';
  document.getElementById("me").innerHTML = P.map(p =>
    `<option value="${p.id}"${p.id === S.me ? " selected" : ""}>${esc(p.name)}${p.role === "coord" ? " (coordinación)" : ""}</option>`).join("");
  renderNav();
  const groups = [{ id: 0, title: "Comentarios generales", parts: [] }, ...DATA.problems];
  document.getElementById("doc").innerHTML = groups.map(renderProblem).join("");
  document.querySelectorAll("[data-draft]").forEach(t => { t.value = ui.drafts[t.dataset.draft] || ""; });
  const f = document.querySelector("[data-focus]");
  if (f) f.focus();
}

function renderNav() {
  const cnt = n => n ? ` <span class="cnt">${n}</span>` : "";
  document.getElementById("nav").innerHTML =
    `<a class="prob" href="#p0">General${cnt(pend(0))}</a>` +
    DATA.problems.map(p => `<a class="prob" href="#p${p.id}">${p.id}. ${esc(p.title)}${cnt(pend(p.id))}</a>` +
      p.parts.map(x => `<a class="part" href="#p${p.id}${x}">Parte ${x}${cnt(pend(p.id, x))}</a>`).join("")).join("");
}

function renderProblem(p) {
  const n = pend(p.id);
  const head = `<h2 id="p${p.id}"><span>${p.id ? p.id + ". " : ""}${esc(p.title)}</span>
    <span class="cnt${n ? "" : " done"}">${n ? n + " pendiente" + (n > 1 ? "s" : "") : "sin pendientes"}</span></h2>`;
  if (p.id === 0) return head + renderList(0, "");
  const whole = S.comments.some(c => c.problem === p.id && c.part === "") || ui.adding === p.id + ":"
    ? `<div class="ph"><h3>Todo el problema</h3>${renderList(p.id, "")}</div>` : "";
  return head + whole + p.parts.map(x =>
    `<div class="ph"><h3 id="p${p.id}${x}">Parte ${x} ${renderReview(p.id, x)}</h3>${renderList(p.id, x)}</div>`).join("");
}

function renderReview(pid, part) {
  const k = pid + part;
  const rs = profs().map(x => [x, (S.reviews[x.id + ":" + k] || {})]);
  const oks = rs.filter(([, r]) => r.ok).map(([x]) => `<span class="y">✓ ${esc(first(x.id))}</span>`);
  const mins = rs.map(([, r]) => r.min).filter(v => v > 0);
  const difs = rs.map(([, r]) => r.dif).filter(v => v > 0);
  const bits = [];
  if (oks.length) bits.push(oks.join(" "));
  if (mins.length) bits.push(`⏱ ${Math.min(...mins) === Math.max(...mins) ? mins[0] : Math.min(...mins) + "–" + Math.max(...mins)} min`);
  if (difs.length) bits.push(`dificultad ${(difs.reduce((a, b) => a + b, 0) / difs.length).toFixed(1).replace(".0", "")}/5`);
  const detail = rs.filter(([, r]) => r.ok || r.min || r.dif).map(([x, r]) =>
    `${x.name}: ${r.ok ? "OK" : "sin OK"}${r.min ? ", " + r.min + " min" : ""}${r.dif ? ", dificultad " + r.dif : ""}`).join("\n");
  let mine = "";
  if (person(S.me).role === "prof") {
    const r = S.reviews[S.me + ":" + k] || {};
    mine = ui.okEdit === k
      ? `<span class="okform">
          <label><input type="checkbox" data-rev="ok" data-k="${k}"${r.ok ? " checked" : ""}> OK para mí</label>
          <label>tiempo <input type="number" min="0" data-rev="min" data-k="${k}" value="${r.min ?? ""}"> min</label>
          <label>dificultad <select data-rev="dif" data-k="${k}"><option value="">–</option>${[1, 2, 3, 4, 5].map(d => `<option${r.dif === d ? " selected" : ""}>${d}</option>`).join("")}</select></label>
          <button class="lk" data-act="okedit" data-v="">listo</button></span>`
      : `<button class="lk myok" data-act="okedit" data-v="${k}">${r.ok ? "mi OK ✓" : "dar mi OK"}</button>`;
  }
  return `<span class="rev" title="${esc(detail)}">${bits.join(" · ")}</span>${mine}`;
}

function renderList(pid, part) {
  const cs = S.comments.filter(c => c.problem === pid && c.part === part);
  const key = pid + ":" + part;
  const add = ui.adding === key
    ? `<div class="box" style="margin-left:22px"><textarea data-draft="new${key}" data-focus placeholder="Tu comentario. Si alguien ya dijo lo mismo, dale +1."></textarea>
        <div class="row"><button class="btn pri" data-act="post" data-v="${key}">Publicar</button>
        <button class="lk" data-act="add" data-v="">cancelar</button><span class="hint">⌘/Ctrl + Enter publica</span></div></div>`
    : `<div class="add"><button class="lk" data-act="add" data-v="${key}">+ comentar</button></div>`;
  return cs.map(renderComment).join("") + add;
}

function renderComment(c) {
  const long = c.text.length > 320 && !ui.expanded[c.id];
  const plus = c.plus.length ? ` <span class="plus1">+1 ${esc(c.plus.map(first).join(", "))}</span>` : "";
  const reps = c.replies.map(r => {
    const d = isNewR(r) ? `<span class="dot"></span>` : "";
    if (!r.text) return r.action === "Reabierto" ? `<div class="r">${d}<span class="ev">${esc(first(r.author))} reabrió</span></div>` : "";
    return `<div class="r">${d}<b>${esc(first(r.author))}</b>${r.action === "Reabierto" ? ` <span class="ev">(reabrió)</span>` : ""}: ${esc(r.text)}</div>`;
  }).join("");
  const a = [];
  if (c.author !== S.me) a.push(`<button data-act="plus" data-v="${c.id}" class="${c.plus.includes(S.me) ? "on" : ""}">+1</button>`);
  a.push(`<button data-act="reply" data-v="${c.id}">responder</button>`);
  if (c.state === "Pendiente") {
    if (isCoord()) a.push(`<button data-act="state" data-v="${c.id}" data-s="Resuelto">✓ resuelto</button>`,
                          `<button data-act="state" data-v="${c.id}" data-s="Descartado">– descartar</button>`);
  } else a.push(`<button data-act="reply" data-v="${c.id}" data-reopen="1">reabrir</button>`);
  let box = "";
  if (ui.open && ui.open.id === c.id) {
    const reopen = ui.open.reopen;
    box = `<div class="box"><textarea data-draft="r${c.id}" data-focus placeholder="${reopen ? "¿Qué falta?" : "Respuesta"}"></textarea>
      <div class="row">${reopen
        ? `<button class="btn pri" data-act="send" data-v="${c.id}" data-s="Pendiente">Reabrir</button>`
        : `<button class="btn pri" data-act="send" data-v="${c.id}">Responder</button>` +
          (isCoord() && c.state === "Pendiente" ? `<button class="btn" data-act="send" data-v="${c.id}" data-s="Resuelto">Responder y resolver</button><button class="btn" data-act="send" data-v="${c.id}" data-s="Descartado">Responder y descartar</button>` : "")}
        <button class="lk" data-act="reply" data-v="">cancelar</button></div></div>`;
  }
  return `<div class="c${c.state !== "Pendiente" ? " closed" : ""}${long ? " clamp" : ""}">
    ${isNewC(c) || c.replies.some(r => !r.text && isNewR(r)) ? `<span class="dot"></span>` : ""}<span class="st ${c.state}" title="${esc(stateTitle(c))}">${GLYPH[c.state]}</span>
    <div class="body"><b>${esc(first(c.author))}:</b> ${esc(c.text)}</div>
    ${long ? `<button class="more" data-act="expand" data-v="${c.id}">ver todo</button>` : ""}${plus}
    ${reps}
    <div class="acts">${a.join("")}</div>${box}
  </div>`;
}

function stateTitle(c) {
  const last = [...c.replies].reverse().find(r => r.action);
  return c.state + (last && c.state !== "Pendiente" ? " por " + person(last.author).name : "");
}

function setState(c, state, text) {
  const action = state === c.state ? undefined : state === "Pendiente" ? "Reabierto" : state;
  if (!text && !action) return false;
  c.replies.push({ author: S.me, at: Date.now(), text: text || "", action });
  c.state = state;
  return true;
}

function post(key) {
  const text = (ui.drafts["new" + key] || "").trim();
  if (!text) return;
  const [pid, part] = key.split(":");
  S.comments.push({ id: S.nextId++, problem: Number(pid), part, author: S.me, created: Date.now(),
    text, state: "Pendiente", plus: [], replies: [] });
  delete ui.drafts["new" + key]; ui.adding = null; save(); render();
}

document.addEventListener("input", e => { if (e.target.dataset.draft) ui.drafts[e.target.dataset.draft] = e.target.value; });
document.addEventListener("keydown", e => {
  const t = e.target;
  if (!t.dataset || !t.dataset.draft) return;
  if (e.key === "Escape") { ui.adding = null; ui.open = null; render(); }
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
    const b = t.parentElement.querySelector(".btn.pri");
    if (b) b.click();
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "me") { S.me = t.value; arrive(); ui.open = ui.adding = ui.okEdit = null; render(); return; }
  if (!t.dataset.rev) return;
  const k = S.me + ":" + t.dataset.k;
  const r = S.reviews[k] || (S.reviews[k] = {});
  if (t.dataset.rev === "ok") r.ok = t.checked;
  if (t.dataset.rev === "min") r.min = t.value === "" ? undefined : Math.max(0, parseInt(t.value, 10) || 0);
  if (t.dataset.rev === "dif") r.dif = t.value === "" ? undefined : Number(t.value);
  save(); render();
});
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const v = b.dataset.v;
  const c = S.comments.find(x => String(x.id) === v);
  switch (b.dataset.act) {
    case "reset":
      if (!confirm("¿Volver al ejemplo original? Se pierde lo que hayas hecho.")) return;
      S = seed(); arrive(); Object.assign(ui, { open: null, adding: null, okEdit: null, drafts: {} }); break;
    case "add": ui.adding = v || null; ui.open = null; break;
    case "post": post(v); return;
    case "plus": c.plus = c.plus.includes(S.me) ? c.plus.filter(x => x !== S.me) : [...c.plus, S.me]; save(); break;
    case "reply": ui.open = v ? { id: Number(v), reopen: !!b.dataset.reopen } : null; ui.adding = null; break;
    case "state": setState(c, b.dataset.s, ""); save(); break;
    case "send": {
      const text = (ui.drafts["r" + v] || "").trim();
      if (!setState(c, b.dataset.s || c.state, text)) return;
      delete ui.drafts["r" + v]; ui.open = null; save(); break;
    }
    case "expand": ui.expanded[v] = true; break;
    case "okedit": ui.okEdit = v || null; break;
  }
  render();
});

render();
</script>
</body>
</html>
