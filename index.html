<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revisión de enunciados</title>
<style>
:root {
  --bg: #f1f2f4; --card: #fff; --ink: #22262c; --muted: #7d8590; --faint: #b9bec6; --line: #e8eaed;
  --prof: #22262c; --coord: #2459c7; --coord-soft: #eef3fd;
  --pend: #c98208; --ok: #23854f; --ok-soft: #e5f4ea; --rej: #c8323b; --rej-soft: #fbe9ea; --info: #7a4fc9; --info-soft: #f1ebfb; --new: #d63b72; --new-soft: #fde8ef;
  --shadow: 0 1px 3px rgba(20, 30, 50, .08), 0 1px 2px rgba(20, 30, 50, .04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121418; --card: #1c1f25; --ink: #e4e7eb; --muted: #8d95a1; --faint: #4a515b; --line: #2b3038;
    --prof: #e4e7eb; --coord: #86a6ff; --coord-soft: #1f2a42;
    --pend: #f0b04a; --ok: #6fcf97; --ok-soft: #1b3326; --rej: #ff6b72; --rej-soft: #3a1c1f; --info: #b79cff; --info-soft: #2b2340; --new: #ff7aa6; --new-soft: #3a1f2a;
    --shadow: 0 1px 3px rgba(0, 0, 0, .4);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, select, input, textarea { font: inherit; color: inherit; }
.layout { max-width: 1080px; margin: 0 auto; padding: 0 16px 120px; display: flex; gap: 32px; }
nav { width: 200px; flex: none; position: sticky; top: 0; align-self: flex-start;
  padding-top: 76px; font-size: 13px; max-height: 100vh; overflow: auto; }
nav a { display: flex; justify-content: space-between; gap: 6px; color: var(--muted); text-decoration: none; padding: 1px 0; }
nav a:hover { color: var(--ink); }
nav a.prob { color: var(--ink); font-weight: 600; margin-top: 10px; }
nav a.sub { padding-left: 12px; }
nav .cnt { color: var(--pend); }
nav .done { color: var(--ok); }
main { flex: 1; min-width: 0; max-width: 740px; }
@media (max-width: 900px) { nav { display: none; } }

.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
  gap: 4px 16px; padding: 22px 0 14px; }
.top h1 { font-size: 20px; margin: 0; }
.top .est { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 10px; }
.user select { border: 1px solid var(--line); border-radius: 999px; background: var(--card);
  padding: 3px 10px; font-size: 13px; }

section.prob { background: var(--card); border-radius: 12px; box-shadow: var(--shadow);
  padding: 4px 20px 14px; margin-bottom: 18px; scroll-margin-top: 12px; }
h2 { font-size: 18px; margin: 12px 0 0; display: flex; flex-wrap: wrap; justify-content: space-between;
  align-items: baseline; gap: 2px 12px; }
h2 .meta { font-size: 13px; font-weight: 400; color: var(--muted); }
.cnt { color: var(--pend); }
.alldone { color: var(--ok); font-weight: 600; }

.part { margin-top: 18px; scroll-margin-top: 12px; }
h3 { font-size: 15px; margin: 0; padding-bottom: 4px; border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 12px; }
.okall { font-size: 12px; font-weight: 600; color: var(--ok); background: var(--ok-soft);
  border-radius: 999px; padding: 1px 9px; }

.rev { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; font-size: 13px;
  color: var(--muted); padding: 7px 0 4px; }
.rev .avg b { color: var(--ink); font-weight: 600; }
.rev .okers { color: var(--ok); }
.mine { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 13px;
  background: var(--bg); border-radius: 8px; padding: 6px 10px; margin: 2px 0 6px; }
.mine .lbl { font-weight: 600; color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--card); }
.seg button { border: none; background: none; padding: 1px 8px; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--coord); color: #fff; }
.mine input { width: 52px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); padding: 1px 6px; }
.okbtn { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 1px 12px;
  cursor: pointer; color: var(--muted); }
.okbtn.on { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 600; }
.all { display: grid; grid-template-columns: max-content max-content max-content max-content; gap: 2px 22px;
  font-size: 13px; background: var(--bg); border-radius: 8px; padding: 6px 10px; margin: 2px 0 6px; }
.all .h { color: var(--muted); }
.all .y { color: var(--ok); font-weight: 600; }
.all .x { color: var(--faint); }

.c { position: relative; padding: 9px 0 9px 24px; border-bottom: 1px solid var(--line); }
.c .st { position: absolute; left: 2px; top: 9px; width: 16px; text-align: center; font-weight: 700; }
.st.Pendiente { color: var(--pend); }
.st.Resuelto { color: var(--ok); }
.st.Rechazado { color: var(--rej); }
.st.Info { color: var(--info); }
nav .inf, .inf { color: var(--info); }
.c.closed > .body { color: var(--muted); }
.body { white-space: pre-wrap; overflow-wrap: anywhere; }
.c.clamp > .body { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.n.prof { font-weight: 700; color: var(--prof); }
.n.coord { font-weight: 700; color: var(--coord); }
.n.coord::before { content: "◆ "; font-size: 11px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--new);
  margin-right: 6px; vertical-align: 2px; }
.r { font-size: 14px; margin: 6px 0 0; padding: 4px 10px; border-left: 3px solid var(--line);
  white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }
.r.coord { background: var(--coord-soft); border-left-color: var(--coord); border-radius: 0 6px 6px 0; }
.c.closed .r { color: var(--muted); }
.tag { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 0 7px;
  margin: 0 2px 0 6px; vertical-align: 1px; }
.tag.Resuelto { color: var(--ok); background: var(--ok-soft); }
.tag.Rechazado { color: var(--rej); background: var(--rej-soft); }
.tag.Info { color: var(--info); background: var(--info-soft); }
.tag.Reabierto { color: var(--pend); background: var(--bg); border: 1px solid var(--pend); }
.acts { font-size: 12px; position: absolute; right: 0; top: 4px; background: var(--card);
  border: 1px solid var(--line); border-radius: 6px; padding: 1px 2px 1px 8px; display: none; box-shadow: var(--shadow); }
.c:hover > .acts, .c:focus-within > .acts { display: block; }
@media (hover: none) { .acts { display: block; position: static; border: none; padding: 4px 0 0; background: none; box-shadow: none; } }
.acts button, .lk { border: none; background: none; padding: 0 8px 0 0; color: var(--muted); cursor: pointer; font-size: 12px; }
.acts button:hover, .lk:hover { color: var(--coord); }
.more { border: none; background: none; padding: 0; color: var(--coord); cursor: pointer; font-size: 13px; }
.add { padding: 6px 0 0 24px; }
.add .lk { color: var(--faint); font-size: 13px; }
.add .lk:hover { color: var(--coord); }
.box { margin: 6px 0 2px; }
.box textarea { width: 100%; min-height: 64px; border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 8px; background: var(--card); resize: vertical; }
.box textarea:focus { outline: none; border-color: var(--coord); }
.box .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; align-items: center; font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 2px 10px; cursor: pointer; font-size: 13px; }
.btn.pri { background: var(--coord); border-color: var(--coord); color: #fff; }
.hint { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="layout">
  <nav id="nav"></nav>
  <main>
    <div class="top">
      <h1><span id="title"></span><span class="est" id="est"></span></h1>
      <div class="user"><select id="me" aria-label="Usuario"></select></div>
    </div>
    <div id="doc"></div>
  </main>
</div>

<script>
"use strict";
const DATA = {"key": "demo", "title": "Revisión I2", "people": [{"id": "ana", "name": "Ana Rojas", "role": "prof"}, {"id": "bruno", "name": "Bruno Díaz", "role": "prof"}, {"id": "carla", "name": "Carla Soto", "role": "prof"}, {"id": "diego", "name": "Diego Paredes", "role": "prof"}, {"id": "elena", "name": "Elena Vidal", "role": "coord"}, {"id": "felipe", "name": "Felipe Mora", "role": "coord"}], "me": "ana", "seenH": {"ana": 24}, "problems": [{"id": 1, "title": "Tren de carga", "parts": ["A", "B", "C"]}, {"id": 2, "title": "Números felices", "parts": ["A", "B", "C"]}, {"id": 3, "title": "Biblioteca", "parts": ["A", "B", "C"]}], "comments": [{"p": 0, "part": "", "by": "carla", "h": 72, "text": "¿Usamos el mismo formato de salida en los tres problemas? En el 1 piden \"x y\" y en el 3 \"x, y\".", "state": "Resuelto", "replies": [{"by": "elena", "h": 50, "text": "Unificado: ahora todos usan \"x y\" separado por un espacio.", "act": "Resuelto"}]}, {"p": 0, "part": "", "by": "diego", "h": 70, "text": "La prueba me parece larga para 2 horas. ¿Sacamos una parte C?", "replies": [{"by": "elena", "h": 26, "text": "Con los tiempos que han puesto sale ≈ 121 min. Esperamos los que faltan y lo decidimos el jueves."}, {"by": "diego", "h": 12, "text": "Ok. Yo sacaría la 3C, que es la más larga."}]}, {"p": 1, "part": "A", "by": "ana", "h": 68, "text": "No está claro si el input termina con una línea vacía o con la palabra FIN.", "state": "Resuelto", "replies": [{"by": "elena", "h": 50, "text": "Hecho: se aclaró que termina con FIN. Actualizado en Clearn.", "act": "Resuelto"}]}, {"p": 1, "part": "A", "by": "bruno", "h": 67, "text": "En los testcases públicos casi todos los trenes llegan justo con la carga exacta. Balancearía para pillar errores de < vs <=.", "replies": [{"by": "elena", "h": 49, "text": "Hecho: 3 de los 6 casos públicos ahora tienen carga sobrante.", "act": "Resuelto"}, {"by": "bruno", "h": 10, "text": "En los públicos sí, pero en los privados siguen casi todos exactos. Habría que balancear también esos.", "act": "Reabierto"}]}, {"p": 1, "part": "B", "by": "diego", "h": 66, "text": "La B se parece demasiado a la A: si no sacas la A, no sacas la B. ¿Hacemos algo independiente con la misma temática?", "replies": [{"by": "bruno", "h": 60, "text": "No estoy de acuerdo: la B agrega un if dentro del ciclo, sí evalúa algo más."}, {"by": "carla", "h": 58, "text": "Igual me preocupa la dependencia. Podría recibir los datos ya calculados en vez de depender de la A."}]}, {"p": 1, "part": "B", "by": "ana", "h": 65, "text": "\"vagones\" y \"carros\" se usan como sinónimos. Usaría solo \"vagones\".", "state": "Resuelto", "replies": [{"by": "felipe", "h": 48, "text": "Hecho, ahora solo dice \"vagones\".", "act": "Resuelto"}]}, {"p": 1, "part": "C", "by": "carla", "h": 64, "text": "El enunciado es muy largo para una pregunta de prueba. Sacaría el párrafo de la historia del tren.", "replies": [{"by": "felipe", "h": 20, "text": "Hecho: se acortó a la mitad.", "act": "Resuelto"}, {"by": "carla", "h": 3, "text": "Sigue habiendo dos párrafos de historia antes del objetivo. Dejaría solo una frase.", "act": "Reabierto"}]}, {"p": 2, "part": "", "by": "bruno", "h": 63, "text": "En las tres partes el ejemplo explica el algoritmo paso a paso. Lo dejaría solo con input y output.", "state": "Resuelto", "replies": [{"by": "felipe", "h": 47, "text": "Hecho en A, B y C.", "act": "Resuelto"}]}, {"p": 2, "part": "A", "by": "bruno", "h": 35, "text": "El caso borde n = 1 no está claro.", "replies": [{"by": "felipe", "h": 30, "text": "¿Te refieres a si 1 es feliz o al formato de salida?", "act": "Info"}, {"by": "bruno", "h": 8, "text": "A si 1 es feliz: el enunciado no lo dice y el testcase 3 asume que sí."}]}, {"p": 2, "part": "A", "by": "bruno", "h": 62, "text": "\"Entero positivo n ≥ 1\" puede leerse como que hay que validar el input. Pondría \"(n ≥ 1)\".", "state": "Resuelto", "replies": [{"by": "felipe", "h": 46, "text": "Cambiado.", "act": "Resuelto"}]}, {"p": 2, "part": "B", "by": "ana", "h": 61, "text": "Mi solución correcta dio timeout en un testcase. ¿El límite de tiempo está pensado para fuerza bruta?", "replies": [{"by": "felipe", "h": 45, "text": "Hecho: se redujo el tamaño de los casos grandes.", "act": "Resuelto"}, {"by": "ana", "h": 30, "text": "Lo volví a probar y sigue dando timeout el caso 7.", "act": "Reabierto"}, {"by": "felipe", "h": 6, "text": "Revisando: el caso 7 quedó con el tamaño antiguo. Lo cambio hoy."}]}, {"p": 2, "part": "C", "by": "carla", "h": 60, "text": "¿Pueden borrar el código entregado y escribir el suyo? Habría que decirlo explícitamente.", "state": "Rechazado", "replies": [{"by": "felipe", "h": 44, "text": "No lo cambiamos: el enunciado ya dice \"puedes hacer los cambios que estimes convenientes\".", "act": "Rechazado"}, {"by": "carla", "h": 40, "text": "OK, me parece bien."}]}, {"p": 2, "part": "C", "by": "diego", "h": 59, "text": "Sin arreglar nada del código entregado ya se pasan 2 testcases. Estamos regalando puntos.", "state": "Resuelto", "replies": [{"by": "felipe", "h": 43, "text": "Hecho: ahora sin cambios no pasa ningún testcase privado.", "act": "Resuelto"}]}, {"p": 3, "part": "", "by": "carla", "h": 58, "text": "Recordar que pueden leer las preguntas en cualquier orden: en la B y la C hay que volver a explicar cómo funciona la biblioteca.", "state": "Resuelto", "replies": [{"by": "elena", "h": 42, "text": "Hecho: se agregó un párrafo corto al inicio de la B y la C.", "act": "Resuelto"}]}, {"p": 3, "part": "A", "by": "diego", "h": 57, "text": "¿Los libros prestados cuentan como ocupados o como libres en el estante?", "state": "Resuelto", "replies": [{"by": "elena", "h": 41, "text": "Hecho: se aclaró que cuentan como libres.", "act": "Resuelto"}]}, {"p": 3, "part": "B", "by": "ana", "h": 33, "text": "El ejemplo no coincide con lo que dice el enunciado.", "state": "Info", "replies": [{"by": "elena", "h": 5, "text": "¿Cuál ejemplo? En Clearn la parte B tiene dos. ¿Y qué esperabas que saliera?", "act": "Info"}]}, {"p": 3, "part": "B", "by": "ana", "h": 56, "text": "\"estante\" aparece sin tilde en el segundo párrafo.", "state": "Resuelto", "replies": [{"by": "elena", "h": 40, "text": "", "act": "Resuelto"}]}, {"p": 3, "part": "C", "by": "bruno", "h": 55, "text": "No se entiende qué devuelve la función si el grupo de libros no cabe en ningún estante.", "replies": [{"by": "elena", "h": 18, "text": "Hecho: se agregó \"retorna -1 si no cabe\".", "act": "Resuelto"}, {"by": "bruno", "h": 2, "text": "El enunciado ya lo dice, pero el ejemplo 2 sigue mostrando None en vez de -1.", "act": "Reabierto"}]}, {"p": 3, "part": "C", "by": "diego", "h": 4, "text": "Agregaría una imagen para el caso en que no cabe el grupo de libros."}], "reviews": {"ana:1A": {"ok": true, "min": 6, "dif": 2}, "bruno:1A": {"min": 8, "dif": 2}, "carla:1A": {"ok": true, "min": 5, "dif": 1}, "diego:1A": {"ok": true, "min": 7, "dif": 2}, "ana:1B": {"min": 10, "dif": 3}, "bruno:1B": {"ok": true, "min": 9, "dif": 3}, "diego:1B": {"min": 12, "dif": 3}, "ana:1C": {"min": 18, "dif": 4}, "carla:1C": {"min": 22, "dif": 4}, "ana:2A": {"ok": true, "min": 12, "dif": 2}, "bruno:2A": {"ok": true, "min": 15, "dif": 3}, "carla:2A": {"ok": true, "min": 11, "dif": 2}, "diego:2A": {"ok": true, "min": 10, "dif": 2}, "ana:2B": {"min": 14, "dif": 3}, "bruno:2B": {"ok": true, "min": 12, "dif": 3}, "carla:2B": {"ok": true, "min": 16, "dif": 4}, "ana:2C": {"ok": true, "min": 9, "dif": 3}, "bruno:2C": {"ok": true, "min": 8, "dif": 3}, "carla:2C": {"ok": true, "min": 10, "dif": 2}, "diego:2C": {"ok": true, "min": 9, "dif": 3}, "ana:3A": {"ok": true, "min": 7, "dif": 2}, "carla:3A": {"ok": true, "min": 6, "dif": 2}, "diego:3A": {"ok": true, "min": 8, "dif": 2}, "carla:3B": {"ok": true, "min": 20, "dif": 4}, "diego:3B": {"min": 15, "dif": 3}, "bruno:3C": {"min": 25, "dif": 5}}};
const KEY = "revision-enunciados:" + DATA.key;
const H = 3600e3;

// Times in DATA are "hours ago", so the example always looks recent.
function seed() {
  const now = Date.now(), t = h => now - h * H;
  let n = 0;
  const comments = DATA.comments.map(c => ({
    id: ++n, problem: c.p, part: c.part || "", author: c.by, created: t(c.h), text: c.text,
    state: c.state || "Pendiente",
    replies: (c.replies || []).map(r => ({ author: r.by, at: t(r.h), text: r.text || "", action: r.act })),
  }));
  const lastSeen = {};
  DATA.people.forEach(p => lastSeen[p.id] = t((DATA.seenH || {})[p.id] ?? 24));
  return { comments, reviews: structuredClone(DATA.reviews || {}), lastSeen, me: DATA.me, nextId: n + 1 };
}

let S = null;
try { if (!/[?&]reset\b/.test(location.search)) S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!S || !S.comments) S = seed();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

// "New for you" is fixed at arrival; the visit itself counts as seen for next time.
let since;
function arrive() { since = S.lastSeen[S.me] || 0; S.lastSeen[S.me] = Date.now(); save(); }
arrive();

const ui = { open: null, adding: null, expanded: {}, drafts: {} };
const P = DATA.people;
const person = id => P.find(p => p.id === id) || { name: "?", role: "prof" };
const first = id => person(id).name.split(" ")[0];
const role = id => person(id).role;
const isCoord = () => role(S.me) === "coord";
const profs = () => P.filter(p => p.role === "prof");
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const name = id => `<span class="n ${role(id)}" title="${role(id) === "coord" ? "Coordinación" : "Profe"}">${esc(first(id))}</span>`;
const NEW = `<span class="dot" title="Nuevo para ti"></span>`;
const isNewC = c => c.author !== S.me && c.created > since;
const isNewR = r => r.author !== S.me && r.at > since;
const pend = (pid, part) => S.comments.filter(c => c.problem === pid && (part === undefined || c.part === part) && c.state === "Pendiente").length;
const GLYPH = { Pendiente: "○", Resuelto: "✓", Rechazado: "✕", Info: "?" };
const LABEL = { Pendiente: "Pendiente", Resuelto: "Resuelto", Rechazado: "Rechazado", Info: "Falta información del profe" };
const closed = c => c.state === "Resuelto" || c.state === "Rechazado";
const waiting = (pid, part) => S.comments.filter(c => c.problem === pid && (part === undefined || c.part === part) && c.state === "Info").length;
const TAG = { Resuelto: "✓ resuelto", Rechazado: "✕ rechazado", Reabierto: "↺ reabierto", Info: "? pide información" };
const fmt = x => (Math.round(x * 10) / 10).toString().replace(".", ",");

// ---------- per-part review: difficulty, time, OK ----------
function partStats(k) {
  const rs = profs().map(p => S.reviews[p.id + ":" + k] || {});
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const oks = profs().filter(p => (S.reviews[p.id + ":" + k] || {}).ok);
  return { dif: avg(rs.map(r => r.dif).filter(Boolean)), min: avg(rs.map(r => r.min).filter(Boolean)),
           oks, allOk: oks.length === profs().length };
}
function problemStats(p) {
  const st = p.parts.map(x => partStats(p.id + x));
  const mins = st.map(s => s.min).filter(v => v !== null);
  const difs = st.map(s => s.dif).filter(v => v !== null);
  return { min: mins.length === st.length ? mins.reduce((a, b) => a + b, 0) : null,
           dif: difs.length ? difs.reduce((a, b) => a + b, 0) / difs.length : null,
           allOk: st.every(s => s.allOk) };
}

function render() {
  document.getElementById("title").textContent = DATA.title;
  const tot = DATA.problems.map(problemStats);
  document.getElementById("est").textContent = tot.every(s => s.min !== null)
    ? `tiempo estimado ≈ ${Math.round(tot.reduce((a, s) => a + s.min, 0))} min` : "";
  document.getElementById("me").innerHTML = P.map(p =>
    `<option value="${p.id}"${p.id === S.me ? " selected" : ""}>${p.role === "coord" ? "◆ " : ""}${esc(p.name)}</option>`).join("");
  renderNav();
  const groups = [{ id: 0, title: "Comentarios generales", parts: [] }, ...DATA.problems];
  document.getElementById("doc").innerHTML = groups.map(renderProblem).join("");
  document.querySelectorAll("[data-draft]").forEach(t => { t.value = ui.drafts[t.dataset.draft] || ""; });
  const f = document.querySelector("[data-focus]");
  if (f) f.focus();
}

function renderNav() {
  const cnt = (pid, part) => {
    const n = pend(pid, part), w = waiting(pid, part);
    return n || w ? `<span>${n ? `<span class="cnt">${n}</span>` : ""}${w ? ` <span class="inf" title="esperando información">?${w}</span>` : ""}</span>` : "";
  };
  document.getElementById("nav").innerHTML =
    `<a class="prob" href="#p0"><span>General</span>${cnt(0)}</a>` +
    DATA.problems.map(p => `<a class="prob" href="#p${p.id}"><span>${p.id}. ${esc(p.title)}</span>${cnt(p.id)}</a>` +
      p.parts.map(x => `<a class="sub" href="#p${p.id}${x}"><span>Parte ${x}</span>${cnt(p.id, x) || (partStats(p.id + x).allOk ? `<span class="done">✓ OK</span>` : "")}</a>`).join("")).join("");
}

function renderProblem(p) {
  const n = pend(p.id);
  const w = waiting(p.id);
  let meta = [n ? `<span class="cnt">${n} pendiente${n > 1 ? "s" : ""}</span>` : "",
              w ? `<span class="inf">${w} esperando información</span>` : ""].filter(Boolean).join(" · ");
  if (p.id) {
    const s = problemStats(p);
    const bits = [];
    if (s.min !== null) bits.push(`≈ ${Math.round(s.min)} min`);
    if (s.dif !== null) bits.push(`dificultad ${fmt(s.dif)}`);
    if (s.allOk && !n && !w) bits.push(`<span class="alldone">✓ OK de todos</span>`);
    meta = [meta, ...bits].filter(Boolean).join(" · ");
  }
  const head = `<h2><span>${p.id ? p.id + ". " : ""}${esc(p.title)}</span><span class="meta">${meta}</span></h2>`;
  if (p.id === 0) return `<section class="prob" id="p0">${head}${renderList(0, "")}</section>`;
  const whole = S.comments.some(c => c.problem === p.id && c.part === "") || ui.adding === p.id + ":"
    ? `<div class="part"><h3>Todo el problema</h3>${renderList(p.id, "")}</div>` : "";
  return `<section class="prob" id="p${p.id}">${head}${whole}${p.parts.map(x => {
    const k = p.id + x, s = partStats(k);
    return `<div class="part" id="p${k}"><h3><span>Parte ${x}</span>${s.allOk ? `<span class="okall">✓ OK de todos</span>` : ""}</h3>
      ${renderReview(k, s)}${renderList(p.id, x)}</div>`;
  }).join("")}</section>`;
}

function renderReview(k, s) {
  const sum = [];
  sum.push(`<span class="avg">Dificultad <b>${s.dif === null ? "–" : fmt(s.dif) + "/5"}</b></span>`);
  sum.push(`<span class="avg">Tiempo <b>${s.min === null ? "–" : Math.round(s.min) + " min"}</b></span>`);
  sum.push(`<span class="avg">OK <b>${s.oks.length}/${profs().length}</b>${s.oks.length ? ` <span class="okers">${s.oks.map(p => esc(first(p.id))).join(", ")}</span>` : ""}</span>`);
  const detail = profs().map(p => {
    const r = S.reviews[p.id + ":" + k] || {};
    return `${p.name}: dificultad ${r.dif || "–"}, tiempo ${r.min ? r.min + " min" : "–"}, ${r.ok ? "OK" : "sin OK"}`;
  }).join("\n");
  let mine = "";
  if (role(S.me) === "prof") {
    const r = S.reviews[S.me + ":" + k] || {};
    mine = `<div class="mine"><span class="lbl">Tu revisión</span>
      <span>Dificultad <span class="seg">${[1, 2, 3, 4, 5].map(d =>
        `<button data-act="dif" data-k="${k}" data-v="${d}" class="${r.dif === d ? "on" : ""}">${d}</button>`).join("")}</span></span>
      <label>Tiempo <input type="number" min="0" inputmode="numeric" data-rev="min" data-k="${k}" value="${r.min ?? ""}"> min</label>
      <button data-act="ok" data-k="${k}" class="okbtn${r.ok ? " on" : ""}" title="${r.ok ? "Clic para retirar tu OK" : "Para mí esta parte está lista"}">${r.ok ? "✓ OK" : "Dar OK"}</button>
    </div>`;
  } else {
    mine = `<div class="all"><span class="h">Profe</span><span class="h">Dificultad</span><span class="h">Tiempo</span><span class="h">OK</span>${
      profs().map(p => {
        const r = S.reviews[p.id + ":" + k] || {};
        return `<span>${esc(first(p.id))}</span><span>${r.dif ? r.dif + "/5" : `<span class="x">–</span>`}</span>` +
          `<span>${r.min ? r.min + " min" : `<span class="x">–</span>`}</span><span>${r.ok ? `<span class="y">✓ OK</span>` : `<span class="x">–</span>`}</span>`;
      }).join("")}</div>`;
  }
  return `<div class="rev" title="${esc(detail)}">${sum.join("")}</div>${mine}`;
}

function renderList(pid, part) {
  const cs = S.comments.filter(c => c.problem === pid && c.part === part);
  const key = pid + ":" + part;
  const add = ui.adding === key
    ? `<div class="box" style="margin-left:24px"><textarea data-draft="new${key}" data-focus placeholder="Tu comentario"></textarea>
        <div class="row"><button class="btn pri" data-act="post" data-v="${key}">Publicar</button>
        <button class="lk" data-act="add" data-v="">cancelar</button><span class="hint">⌘/Ctrl + Enter publica</span></div></div>`
    : `<div class="add"><button class="lk" data-act="add" data-v="${key}">+ comentar</button></div>`;
  return cs.map(renderComment).join("") + add;
}

function stateTitle(c) {
  const last = [...c.replies].reverse().find(r => r.action);
  return LABEL[c.state] + (last && c.state !== "Pendiente" ? " (" + person(last.author).name + ")" : "");
}

function renderComment(c) {
  const long = c.text.length > 320 && !ui.expanded[c.id];
  const reps = c.replies.map(r => {
    const nw = isNewR(r) ? NEW : "";
    // A state change always shows, as a tag inside the reply of whoever made it.
    const tag = r.action ? `<span class="tag ${r.action}">${TAG[r.action]}</span>` : "";
    return `<div class="r ${role(r.author)}">${nw}${name(r.author)}${tag ? tag + (r.text ? " " + esc(r.text) : "") : ": " + esc(r.text)}</div>`;
  }).join("");
  const a = [`<button data-act="reply" data-v="${c.id}">responder</button>`];
  if (!closed(c)) {
    if (isCoord()) a.push(`<button data-act="state" data-v="${c.id}" data-s="Resuelto">✓ resuelto</button>`,
                          `<button data-act="state" data-v="${c.id}" data-s="Rechazado">✕ rechazar</button>`);
    if (isCoord() && c.state === "Pendiente") a.push(`<button data-act="reply" data-v="${c.id}" data-mode="ask">? pedir información</button>`);
  } else a.push(`<button data-act="reply" data-v="${c.id}" data-mode="reopen">reabrir</button>`);
  let box = "";
  if (ui.open && ui.open.id === c.id) {
    const mode = ui.open.mode;
    const ph = { reopen: "¿Qué falta?", ask: "¿Qué información necesitas del profe?" }[mode] || "Respuesta";
    box = `<div class="box"><textarea data-draft="r${c.id}" data-focus placeholder="${ph}"></textarea>
      <div class="row">${mode === "reopen"
        ? `<button class="btn pri" data-act="send" data-v="${c.id}" data-s="Pendiente">Reabrir</button>`
        : mode === "ask"
        ? `<button class="btn pri" data-act="send" data-v="${c.id}" data-s="Info">Pedir información</button>`
        : `<button class="btn pri" data-act="send" data-v="${c.id}">Responder</button>` +
          (isCoord() && !closed(c) ? `<button class="btn" data-act="send" data-v="${c.id}" data-s="Resuelto">Responder y resolver</button><button class="btn" data-act="send" data-v="${c.id}" data-s="Rechazado">Responder y rechazar</button>` : "")}
        <button class="lk" data-act="reply" data-v="">cancelar</button></div></div>`;
  }
  return `<div class="c${closed(c) ? " closed" : ""}${long ? " clamp" : ""}">
    <span class="st ${c.state}" title="${esc(stateTitle(c))}">${GLYPH[c.state]}</span>
    <div class="body">${isNewC(c) ? NEW : ""}${name(c.author)}: ${esc(c.text)}</div>
    ${long ? `<button class="more" data-act="expand" data-v="${c.id}">ver todo</button>` : ""}
    ${reps}
    <div class="acts">${a.join("")}</div>${box}
  </div>`;
}

function setState(c, state, text) {
  const action = state === c.state ? undefined : state === "Pendiente" ? "Reabierto" : state;
  if (state === "Info" && !text) return false;
  if (!text && !action) return false;
  c.replies.push({ author: S.me, at: Date.now(), text: text || "", action });
  c.state = state;
  return true;
}

function post(key) {
  const text = (ui.drafts["new" + key] || "").trim();
  if (!text) return;
  const [pid, part] = key.split(":");
  S.comments.push({ id: S.nextId++, problem: Number(pid), part, author: S.me, created: Date.now(),
    text, state: "Pendiente", replies: [] });
  delete ui.drafts["new" + key]; ui.adding = null; save(); render();
}

const myReview = k => S.reviews[S.me + ":" + k] || (S.reviews[S.me + ":" + k] = {});

document.addEventListener("input", e => { if (e.target.dataset.draft) ui.drafts[e.target.dataset.draft] = e.target.value; });
document.addEventListener("keydown", e => {
  const t = e.target;
  if (!t.dataset || !t.dataset.draft) return;
  if (e.key === "Escape") { ui.adding = null; ui.open = null; render(); }
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
    const b = t.parentElement.querySelector(".btn.pri");
    if (b) b.click();
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "me") { S.me = t.value; arrive(); ui.open = ui.adding = null; render(); return; }
  if (t.dataset.rev === "min") {
    myReview(t.dataset.k).min = t.value === "" ? undefined : Math.max(0, parseInt(t.value, 10) || 0);
    save(); render();
  }
});
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const v = b.dataset.v;
  const c = S.comments.find(x => String(x.id) === v);
  switch (b.dataset.act) {
    case "add": ui.adding = v || null; ui.open = null; break;
    case "post": post(v); return;
    case "reply": ui.open = v ? { id: Number(v), mode: b.dataset.mode } : null; ui.adding = null; break;
    case "state": setState(c, b.dataset.s, ""); save(); break;
    case "send": {
      const text = (ui.drafts["r" + v] || "").trim();
      if (c.state === "Info" && !b.dataset.s && role(S.me) === "prof") {
        // A professor answering a request for information hands the comment back to coordination.
        if (!text) return;
        c.replies.push({ author: S.me, at: Date.now(), text });
        c.state = "Pendiente";
      } else if (!setState(c, b.dataset.s || c.state, text)) return;
      delete ui.drafts["r" + v]; ui.open = null; save(); break;
    }
    case "expand": ui.expanded[v] = true; break;
    case "dif": { const r = myReview(b.dataset.k); r.dif = r.dif === Number(v) ? undefined : Number(v); save(); break; }
    case "ok": { const r = myReview(b.dataset.k); r.ok = !r.ok; save(); break; }
  }
  render();
});

render();
</script>
</body>
</html>
